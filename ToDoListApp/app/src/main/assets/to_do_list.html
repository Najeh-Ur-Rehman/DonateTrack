<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>To-Do-List - Elite</title>

  <!-- Google Fonts: Inter for an elite, clean look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      /* Changed to a subtle, elegant aqua */
      --bg-color: #e0f7fa; 
      --card-bg: #ffffff;
      --primary: #2a9d8f;
      --primary-hover: #21867a;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-radius: 20px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 2rem;
    }
    /* ... rest of original HTML omitted for brevity ... */
  </style>
</head>
<body>
  <!-- Glass Header -->
  <header class="navbar">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <i class="bi bi-clipboard-check-fill me-2" style="color: var(--primary); font-size: 1.5rem;"></i>
      To-Do-List
    </a>
  </header>
  <!-- Main Application Card -->
  <div class="card">
    <div class="d-flex align-items-center mb-4 justify-content-between">
      <h4 class="mb-0 fw-bold" style="letter-spacing: -0.5px;">My List</h4>
      <span class="badge bg-light text-dark border px-3 py-2 rounded-pill shadow-sm" id="task-counter"></span>
    </div>
    <div class="input-group mb-2">
      <input id="todo-input" class="form-control" placeholder="What needs to be done?" aria-label="Add a new task" maxlength="500" autocomplete="off">
      <button id="add-btn" class="btn btn-primary" title="Add task"><i class="bi bi-plus-lg text-white"></i></button>
    </div>
    <div class="d-flex justify-content-end mb-4">
      <small class="text-muted fw-medium" id="char-counter" style="font-size: 0.75rem;">0/500</small>
    </div>
    <ul id="todo-list" class="list-group list-group-flush p-0"></ul>
  </div>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      const STORAGE_KEY = 'todo_tasks_fixed_v1';
      const addBtn = document.getElementById('add-btn');
      const inputEl = document.getElementById('todo-input');
      const listEl = document.getElementById('todo-list');
      const counterEl = document.getElementById('task-counter');
      const charCounterEl = document.getElementById('char-counter');
      // ... script content unchanged ...
    })();
  </script>
</body>
</html>
